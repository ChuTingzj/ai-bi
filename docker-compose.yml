services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_bi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_bi_demo}
      MYSQL_USER: ${MYSQL_USER:-ai_bi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-ppassword']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/ai_bi
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_API_BASE: ${LLM_API_BASE}
      LLM_MODEL: ${LLM_MODEL}
      LLM_TITLE_MODEL: ${LLM_TITLE_MODEL}
      CORS_ORIGINS: http://localhost:3000
      SANDBOX_TIMEOUT_MS: ${SANDBOX_TIMEOUT_MS:-10000}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-128}
      SANDBOX_MAX_ROWS: ${SANDBOX_MAX_ROWS:-1000}
      SANDBOX_MAX_BYTES: ${SANDBOX_MAX_BYTES:-1000000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api

  benchmark-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: benchmark_bi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5433:5432'
    volumes:
      - benchmark_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d benchmark_bi']
      interval: 5s
      timeout: 5s
      retries: 5

  sandbox:
    build:
      context: ./sandbox
    image: ai-bi-sandbox:latest
    profiles:
      - build-only

volumes:
  pgdata:
  benchmark_pgdata:
  mysqldata:
