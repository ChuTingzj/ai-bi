apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-bi-config
data:
  # ===== 服务 =====
  NODE_ENV: production
  API_PORT: "4000"
  CORS_ORIGINS: http://localhost:3000,http://localhost:30000

  # ===== 认证 =====
  JWT_ACCESS_EXPIRES: 15m
  JWT_REFRESH_EXPIRES: 7d

  # ===== LLM（非敏感部分）=====
  LLM_API_BASE: https://openrouter.ai/api/v1
  LLM_MODEL: deepseek/deepseek-v4-pro
  LLM_TITLE_MODEL: ~deepseek/deepseek-v4-flash-latest
  LLM_FALLBACK_MODELS: deepseek/deepseek-chat,~openai/gpt-latest

  # ===== SQL 生成引导 =====
  SQL_GUIDANCE_ENABLED: "true"

  # ===== Docker 沙盒 =====
  SANDBOX_TIMEOUT_MS: "10000"
  SANDBOX_MEMORY_MB: "128"
  SANDBOX_MAX_ROWS: "1000"
  SANDBOX_MAX_BYTES: "1000000"

  # ===== 数据库（非敏感部分）=====
  POSTGRES_DB: ai_bi
  POSTGRES_USER: postgres
  MYSQL_DATABASE: ai_bi_demo
  MYSQL_USER: ai_bi
