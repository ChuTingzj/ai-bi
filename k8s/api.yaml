apiVersion: v1
kind: Service
metadata:
  name: ai-bi-api
  labels:
    app: ai-bi-api
spec:
  type: ClusterIP
  selector:
    app: ai-bi-api
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-bi-api
  labels:
    app: ai-bi-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-bi-api
  template:
    metadata:
      labels:
        app: ai-bi-api
    spec:
      initContainers:
        # SQL 沙盒需要 Docker daemon；kind/containerd 节点没有 docker.sock，
        # 因此以原生 sidecar（restartPolicy: Always，k8s >= 1.29）运行 dind
        - name: dind
          image: docker:27-dind
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          securityContext:
            privileged: true
          env:
            # 置空后 dind 在 2375 端口提供无 TLS 的 API，仅 Pod 内 localhost 访问
            - name: DOCKER_TLS_CERTDIR
              value: ""
          startupProbe:
            exec:
              command: ["docker", "info"]
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: docker-data
              mountPath: /var/lib/docker
        - name: migrate
          image: chuting/ai-bi-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - node
            - packages/db/node_modules/prisma/build/index.js
            - migrate
            - deploy
            - --schema
            - packages/db/prisma/schema.prisma
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-bi-secrets
                  key: DATABASE_URL
      containers:
        - name: api
          image: chuting/ai-bi-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: ai-bi-config
            - secretRef:
                name: ai-bi-secrets
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: docker-data
          emptyDir: {}
